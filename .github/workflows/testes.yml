# Testes automáticos: a cada envio (push) ou pedido de mudança (pull request), o GitHub
# compila o app e roda os testes de cálculo e os testes de tela (robô no celular e no notebook).
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes de cálculo
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Instalar o navegador do robô
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Testes de tela
        run: npm run test:e2e
      - name: Guardar as capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: tests/capturas
          retention-days: 7
